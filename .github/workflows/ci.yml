name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # numba 0.68 publishes wheels for 3.10-3.14; NumPy and SciPy resolve to versions that support each
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e .[dev]
      - run: pytest --cov=tpga --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  platform:
    name: Platform API tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e .[dev] -r platform/backend/requirements.txt
        working-directory: .
      - run: pytest -q platform/backend/tests
        env:
          PYTHONPATH: platform/backend

  web:
    name: Web interface (ESLint, build, Playwright)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: pip install -e ../.. -r ../backend/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          TPGA_API_ORIGIN: http://127.0.0.1:8000
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/smoke.spec.js
        env:
          E2E_START: "1"
          TPGA_DB_PATH: ${{ runner.temp }}/runs.db
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: platform/web/playwright-report

  build:
    name: Build package
    needs: [test, platform, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/tpga solve examples/small_3x3.json --seed 0
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
