[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpga"
version = "0.4.0.dev0"
description = "Transportation problem solved by a permutation-encoded genetic algorithm with a greedy decoder and an exact LP baseline."
readme = "README.md"
license = "MIT"
authors = [{ name = "Almas Murat" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "matplotlib>=3.7", "numba>=0.60"]
keywords = ["transportation problem", "genetic algorithm", "operations research", "optimization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
experiments = ["pyyaml>=6.0", "pandas>=2.0", "pyarrow>=14"]
v2 = ["tpga[experiments]", "highspy>=1.12", "ortools>=9.12", "optuna>=4.0", "rich>=13", "psutil>=5.9"]
dev = ["tpga[experiments,v2]", "pytest>=7", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.8", "build>=1.0"]

[project.scripts]
tpga = "tpga.cli:main"
tpga-exp = "tpga.experiments.v2.cli:main"

[project.urls]
Repository = "https://github.com/Almasmm/tp-ga"
Issues = "https://github.com/Almasmm/tp-ga/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tpga = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long regression runs (deselect with -m \"not slow\")"]
addopts = "-ra -m \"not slow\""

[tool.coverage.run]
source = ["tpga"]
branch = true
# runs execute in worker processes and the CLI in subprocesses; measure them too
parallel = true
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.10"
files = ["src/tpga"]
ignore_missing_imports = true
warn_unused_ignores = true
