# Alembic configuration for the run-history database (platform/data/runs.db).
# The application migrates on first use; manual use from platform/backend:
#   alembic upgrade head      alembic downgrade -1
[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///../data/runs.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
