# 10.4
timing: {cpu: 2, instances_per_cell: 3, runs: 5, methods: [GA-cost-cycle, Tabu, ILS], factor: 1.15}

# 10.5
degenerate:
  variants: {GA-rand-cycle-nd: GA-rand-cycle, GA-cost-cycle-nd: GA-cost-cycle}
  reduce_size: "100x100"
  counts: [10, 5, 3, 2, 1, 0]
  trace: {set: uniform, sizes: ["20x20", "50x50", "100x100"], instances: 3, runs: 5}

# 10.6
bootstrap: {resamples: 10000, seed: 20261120}

# 10.7
figure_linear: [VAM, GA-rand-tuned, GA-cost-tuned, GA-rand-cycle, GA-cost-cycle]
figure_fctp: [Balinski, Tabu, ILS, GA-cost-cycle, "MIP, time of the GA"]
