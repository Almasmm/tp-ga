# Additional experiment v3, answers to a review.
# Plan: docs/v0.4/PREREGISTRATION.md, amendment 10, written after the results of amendments 8 and 9 were seen.
# Every result of this configuration is exploratory. Output: paper_artifacts_v3/review/.
#
#   python -m tpga.experiments.v3 pilot      --config experiments/paper-v3-review.yaml   # times for the rules
#   python -m tpga.experiments.v3 tune       --config experiments/paper-v3-review.yaml   # grids of Tabu and ILS
#   python -m tpga.experiments.v3 rivals     --config experiments/paper-v3-review.yaml   # 10.1 on 60 instances
#   python -m tpga.experiments.v3 generator  --config experiments/paper-v3-review.yaml   # 10.3 b
#   python -m tpga.experiments.v3 degenerate --config experiments/paper-v3-review.yaml   # 10.5
#   python -m tpga.experiments.v3 public     --config experiments/paper-v3-review.yaml   # 10.3 a (downloads files)
#   python -m tpga.experiments.v3 timing     --config experiments/paper-v3-review.yaml   # 10.4, one run at a time
#   python -m tpga.experiments.v3 mipdefault --config experiments/paper-v3-review.yaml [--minutes N]   # 10.2
#   python -m tpga.experiments.v3 report     --config experiments/paper-v3-review.yaml

name: paper-v3-review
problem: fctp
review: true
base: experiments/paper-v3-fctp-ext.yaml     # FCTP instances, methods and runs of amendments 8.4 and 9
linear: experiments/paper-v3-cycle.yaml      # linear set and runs of amendments 8.3 and 9.1
output: paper_artifacts_v3
base_seed: 20261116
runs: 10
workers: 20
budget_factor: 200             # B = 200 m n evaluations
tuned_parameters: experiments/tuned-v2.yaml
selected_k: paper_artifacts_v3/kselect/selected.json

mip: {time_limit_s: 60, threads: 1, rel_gap: 0.0, abs_gap: 0.99}

# 10.0 and 10.9: time limit of all run commands and the allowance of each, in minutes; a command may use the
# allowances up to and including its own minus the time already used; the last one stops final_margin_min
# before the limit
limit_min: 90
final_margin_min: 2
allowance_min: {pilot: 2, tune: 2, rivals: 3, generator: 11, degenerate: 15, public: 5, timing: 10, mipdefault: 36}
safety: 1.25

pilot:
  instances: {seed_base: 20340000, sizes: [[20, 20], [30, 30], [50, 50], [70, 70]], rho: [1.0], count: 1,
              cost: [1, 100], supply: [20, 100]}
  ga: GA-cost-cycle
  linear_instance: u50x50-00-train

# 10.1: order of the lists = order of the tie rule, the first list outermost
rivals:
  Tabu: {kind: tabu, grid: {sample: [1.0, 0.25, 0.05], tenure: [5, 10, 20]}}
  ILS:  {kind: ils,  grid: {perturbation: [2, 4, 8, 16], acceptance: [better, always]}}
tune_runs: 3
reference_ga: GA-cost-cycle
pairs:
  - [GA-cost-cycle, Tabu]
  - [GA-cost-cycle, ILS]

# 10.2
mip_default: {time_limit_s: 300, threads: 0, rel_gap: 0.0, abs_gap: 0.99}

# 10.3 b
generator:
  sizes: [[20, 20], [30, 30], [50, 50]]
  count: 5
  cost: [1, 100]
  supply: [20, 100]
  uniform:      {seed_base: 20320000, rho: [0.05, 5.0], prefix: g}
  concentrated: {seed_base: 20330000, rho: [0.05, 0.2, 1.0, 5.0], prefix: c,
                 mean_supply: 60, large_fraction: 0.1, large_share: 0.8}
  methods: [Balinski, Tabu, ILS, GA-cost-cycle]

# 10.3 a: files of a third-party repository without a stated licence; they are downloaded, not stored in git
