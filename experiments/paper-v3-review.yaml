    1ab1ba073363c7b650fab7ef1f93b8a7755ba2cb. Published values: Glover, Amini, Kochenberger, Journal of
    Heuristics 11 (2005) 307-336, Table 3."
  base_url: "https://raw.githubusercontent.com/Tybirk/RL-FCTP/1ab1ba073363c7b650fab7ef1f93b8a7755ba2cb/Java/Glover/"
  methods: [Balinski, Tabu, ILS, GA-cost-cycle]
  instances:
